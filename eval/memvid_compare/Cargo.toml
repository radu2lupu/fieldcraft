[package]
name = "memvid_compare"
version = "0.1.0"
edition = "2024"
publish = false

# Standalone project: deliberately not a member of the repository workspace.
[workspace]

[dependencies]
memvid-core = { version = "=2.0.140", default-features = false, features = ["lex", "vec"] }
rusqlite = { version = "0.37", features = ["bundled"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde_json = "1"
chrono = "0.4"
sha2 = "0.10"
